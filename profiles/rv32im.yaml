# Sources of the rv32im profile (I + M), in GHDL dependency order.
# Every extension unit that core instantiates directly is analyzed, and the disabled ones
# are removed when the generate statements are elaborated.
# Paths are relative to the root of this repository.
profile: rv32im
extensions: [I, M]
top: core
generics: {has_m: true, has_zicclsm: false}
