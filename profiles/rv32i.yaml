# Sources of the rv32i profile (I only), in GHDL dependency order.
# Same top as rv32im, built with the generic HAS_M => false: no M/ files, and
# an M instruction is a NOP. Paths are relative to the root of this repository.
profile: rv32i
extensions: [I]
top: core
generics: {has_m: false}
sources:
  - common/pipeline_types.vhd
  - common/opcode_consts.vhd
  - common/funct3_consts.vhd
  - common/funct7_consts.vhd
  - common/alu_consts.vhd
  - common/ext_imm_consts.vhd
  - common/ext_ram_consts.vhd
  - common/wb_sel_consts.vhd
  - common/pc_src_consts.vhd
  - common/mem_map_consts.vhd
  - Common-Components/src/generic_register.vhd
  - Common-Components/src/adder.vhd
  - Common-Components/src/mux_2x1.vhd
  - Common-Components/src/mux_4x1.vhd
  - Common-Components/src/flip_flop.vhd
  - Common-Components/src/utils_pkg.vhd
  - I/alu.vhd
  - Common-Components/src/onehot_decoder.vhd
  - Common-Components/src/mux_tree.vhd
  - common/reg_file.vhd
  - I/extender_imm.vhd
  - I/extender_ram.vhd
  - I/store_manager.vhd
  - I/misaligned_unit.vhd
  - common/control_unit.vhd
  - common/bubble_mux.vhd
  - common/forwarding_unit.vhd
  - common/hazard_detection_unit.vhd
  - common/pc_fetch.vhd
  - common/reg_if_id.vhd
  - common/reg_id_ex.vhd
  - common/reg_ex_mem.vhd
  - common/reg_mem_wb.vhd
  - core/stage_if.vhd
  - core/stage_id.vhd
  - core/stage_ex.vhd
  - core/stage_mem.vhd
  - core/stage_wb.vhd
  - core/core.vhd
