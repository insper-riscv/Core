# Sources of the rv32im_zicsr_zifencei profile (I + M + Zicsr + Zifencei), in GHDL dependency order.
# Every extension unit that core instantiates directly is analyzed, and the disabled ones
# are removed when the generate statements are elaborated.
# Paths are relative to the root of this repository.
profile: rv32im_zicsr_zifencei
extensions: [I, M, Zicsr, Zifencei]
top: core
generics: {has_m: true, has_zicsr: true, has_zifencei: true, has_zicclsm: false}
