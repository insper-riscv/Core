# Variantes do config_pkg das provas formais e dos testes por entidade. Cada chave é o nome da variante e o valor
# lista as constantes que mudam em relação ao config_pkg padrão do Common-Components (RV32I com Zicclsm, BOOT_MEMORY de
# 4 KiB, FLASH de 4 KiB a 32 KiB e RAM de 32 KiB a 1 GiB, as duas pela porta direta), no formato CONSTANTE=valor
# separados por espaço: booleanos como true e false, bases e fins do mapa em bytes (hexadecimal) e
# BOOT_MEMORY_BITS em decimal. formal/config_variant.sh <nome> <arquivo> escreve o pacote da variante, que ocupa o
# lugar de src/common/src/config_pkg.vhd na lista de fontes (CONFIG_FILE no formal/run.sh).

# Mapas: a FLASH no barramento a 0x20000000 (256 MiB), logo abaixo da RAM direta de 0x40000000 a 0x60000000.
ext_flash: FLASH_ON_BUS=true FLASH_BASE=0x20000000 FLASH_END=0x40000000 RAM_BASE=0x40000000 RAM_END=0x60000000
# FLASH no barramento de 256 KiB logo depois da BOOT_MEMORY e RAM direta de 64 MiB logo acima de 1 GiB.
ext_rom: FLASH_ON_BUS=true FLASH_END=0x00040000 RAM_BASE=0x40000000 RAM_END=0x44000000
# FLASH de 28 KiB no barramento logo depois da BOOT_MEMORY e RAM direta logo depois dela.
rom_after_boot: FLASH_ON_BUS=true
# Mapa pequeno das falhas de acesso: FLASH de 2 KiB, um buraco de 2 KiB e a RAM de 8 a 16 KiB.
faults_map: FLASH_END=0x00001800 RAM_BASE=0x00002000 RAM_END=0x00004000
# Mapa pequeno das falhas de acesso com as falhas ligadas.
faults_map_access_faults: FLASH_END=0x00001800 RAM_BASE=0x00002000 RAM_END=0x00004000 HAS_ACCESS_FAULTS=true
# Cache de dados, com a RAM no barramento de 0x8000 a 0x40000000.
dcache: HAS_DCACHE=true RAM_ON_BUS=true

# Variantes dos testes por entidade: as extensões que diferem do config_pkg padrão, uma por combinação. As que levam
# o prefixo m_ têm a extensão M.
# Com M.
m: HAS_M=true
# Com interrupts, com M.
m_interrupts: HAS_INTERRUPTS=true HAS_M=true
# Com zicntr, com M.
m_zicntr: HAS_ZICNTR=true HAS_M=true
# Com zicntr, com zihpm, com M.
m_zicntr_zihpm: HAS_ZICNTR=true HAS_ZIHPM=true HAS_M=true
# Com access_faults.
access_faults: HAS_ACCESS_FAULTS=true
# Sem zicclsm.
no_zicclsm: HAS_ZICCLSM=false
# Com zifencei.
zifencei: HAS_ZIFENCEI=true
# Com dcache, com zifencei, com a RAM no barramento.
dcache_zifencei: HAS_DCACHE=true RAM_ON_BUS=true HAS_ZIFENCEI=true
# Com zicntr, com zicsr, com zihpm.
zicntr_zicsr_zihpm: HAS_ZICNTR=true HAS_ZICSR=true HAS_ZIHPM=true
# Com a base E.
e: IS_E=true
# Com zicntr, com zicsr, com zihpm, com falhas de acesso.
zicntr_zicsr_zihpm_access_faults: HAS_ZICNTR=true HAS_ZICSR=true HAS_ZIHPM=true HAS_ACCESS_FAULTS=true
# Com zicsr, com zmmul.
zicsr_zmmul: HAS_ZICSR=true HAS_ZMMUL=true
# Com zicsr, com zimop.
zicsr_zimop: HAS_ZICSR=true HAS_ZIMOP=true
# Com zicsr, com zihintntl, com zihintpause.
zicsr_zihintntl_zihintpause: HAS_ZICSR=true HAS_ZIHINTNTL=true HAS_ZIHINTPAUSE=true
# Com zicsr.
zicsr: HAS_ZICSR=true
# Com zicsr, sem zicclsm.
zicsr_no_zicclsm: HAS_ZICSR=true HAS_ZICCLSM=false
# Com zicsr, com zifencei.
zicsr_zifencei: HAS_ZICSR=true HAS_ZIFENCEI=true
# Com zicond.
zicond: HAS_ZICOND=true
# Com zicsr, com M.
m_zicsr: HAS_ZICSR=true HAS_M=true
# Com a base E, com zicsr, com M.
m_e_zicsr: IS_E=true HAS_ZICSR=true HAS_M=true
# Com zihpm, com M.
m_zihpm: HAS_ZIHPM=true HAS_M=true
# Com interrupts, com sscofpmf, com zihpm, com M.
m_interrupts_sscofpmf_zihpm: HAS_INTERRUPTS=true HAS_SSCOFPMF=true HAS_ZIHPM=true HAS_M=true
# Com interrupts, com zihpm, com M.
m_interrupts_zihpm: HAS_INTERRUPTS=true HAS_ZIHPM=true HAS_M=true
# Com interrupts, com zicsr, com M.
m_interrupts_zicsr: HAS_INTERRUPTS=true HAS_ZICSR=true HAS_M=true
# Com interrupts, com zicsr, com zifencei, com M.
m_interrupts_zicsr_zifencei: HAS_INTERRUPTS=true HAS_ZICSR=true HAS_ZIFENCEI=true HAS_M=true
# Com zicsr, com zifencei, com M.
m_zicsr_zifencei: HAS_ZICSR=true HAS_ZIFENCEI=true HAS_M=true
# Com zihpm, com zicsr, com zicntr, com M.
m_zicntr_zicsr_zihpm: HAS_ZICNTR=true HAS_ZICSR=true HAS_ZIHPM=true HAS_M=true

# RV64 com endereço físico de 40 bits: o Core ainda não executa RV64, mas todas as fontes analisam com esta variante (make check-rv64).
rv64: IS_64=true ADDR_BITS=40
