[project]
name = "riscv-core"
version = "0.1.0"
description = "RV32 pipeline core in VHDL, organized by ISA extension, with per-entity cocotb tests."
license = "Apache-2.0"
# Same range as riscv-tools (tools/Tools/pyproject.toml): one venv serves both.
requires-python = ">=3.14,<3.15"
dependencies = [
    # [sim] pulls cocotb/cocotb-tools at the versions riscv-tools is pinned to,
    # which tests/python/runner.py uses.
    "riscv-tools[sim]",
]

[tool.uv]
package = false

[tool.uv.sources]
riscv-tools = { path = "tools/Tools", editable = true }
