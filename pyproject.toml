[project]
name = "riscv-core"
version = "0.1.0"
description = "RV32 pipeline core in VHDL, organized by ISA extension, with per-entity cocotb tests."
license = "Apache-2.0"
# Same Python as the ci-vhdl image of Infra, which also carries riscv-tools.
requires-python = ">=3.14,<3.15"
dependencies = [
    # tests/python/runner.py runs the entity tests with cocotb (and its cocotb_tools),
    # at the version of the ci-vhdl image. riscv-tools comes from the image, not from here.
    "cocotb==2.1.0",
]

[tool.uv]
package = false

[dependency-groups]
# pylint runs in this environment, so it resolves cocotb when it imports the tests.
dev = [
    "pylint>=4.1.3",
]

# Static analysis of the Python (runner and tests), as run by the python-static-analysis job of the CI.
[tool.ruff]
target-version = "py314"
line-length = 79
extend-exclude = ["Common-Components", "build", "sim_build"]

[tool.ruff.lint]
select = [
    # Core
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes

    # Security
    "S",    # flake8-bandit (Security Scanning/SAST)
    "BLE",  # flake8-blind-except

    # Import orders and formatting
    "I",    # isort
    "Q",    # flake8-quotes
    "D",    # pydocstyle

    # Standards and Moderization
    "UP",   # update-checker
    "N",    # pep8-naming,
    "PTH",  # flake8-pathlib
    "TID",  # flake8-tidy-imports (absolute imports only)

    # Quality and Simplification
    "B",    # flake8-bugbear
    "G",    # flake8-logging-format
    "PERF", # perflint
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PL",   # pylint
    "RUF",  # ruff linting rules

    # Cleanup and Unused Code
    "ERA",  # flake8-eradicate
    "ARG",  # flake8-arg-names (unused-arguments)
]

# PEP 257 rules the numpy convention turns off.
extend-select = [
    "D107",  # docstring in __init__
    "D402",  # summary line must not repeat the signature
]


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pycodestyle]
max-line-length = 79
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-returns = 6
max-branches = 12
max-locals = 15
max-public-methods = 10


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = 72

[tool.complexipy]
paths = ["tests"]
max-complexity-allowed = 10

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["tests"]

[tool.pyrefly]
preset = "basic"
project-includes = ["tests"]
search-path = ["."]
python-version = "3.14"

[tool.pylint.main]
ignore = [".venv", "Common-Components", "build", "sim_build"]
fail-under = 10
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.basic]
# The test packages are named after the ISA extensions (I, M, Zicsr, Zicntr).
module-naming-style = "any"

[tool.pylint.design]
# The simulation models keep their whole state in one object.
max-attributes = 15
min-public-methods = 1

[tool.pylint.messages_control]
# Duplication is gated by codeclone (baseline + --fail-on-new), as the
# CONTRIBUTING says; pylint's own check would count the same clones twice.
disable = ["duplicate-code"]

[tool.deptry]
# The default exclude list also skips tests/, which is the only Python of
# this repository.
exclude = [
    "venv",
    "\\.venv",
    "\\.direnv",
    "\\.git",
    "Common-Components",
    "build",
    "sim_build",
]

# cocotb_tools (the runner) ships inside the cocotb distribution.
[tool.deptry.package_module_name_map]
cocotb = ["cocotb", "cocotb_tools"]
